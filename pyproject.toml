[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-coding-harness"
description = "Agentic Coding Harness: models propose, deterministic infrastructure authorizes, executes, records, and proves."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
  "pydantic>=2.9,<3",
  "anyio>=4.6,<5",
  "httpx>=0.27,<1",
  "typer>=0.13,<1",
  "rich>=13.9,<15",
  "pyyaml>=6.0,<7",
]

[project.scripts]
harness = "agentic_harness.cli:app"

[tool.hatch.version]
path = "src/agentic_harness/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_harness"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "agentic_harness/_bundled_contracts"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "hypothesis>=6.115,<7",
  "jsonschema>=4.23,<5",
]
