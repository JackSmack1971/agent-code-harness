contract: EventRegistry
version: 1
events:
  - {event_type: run.created, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [NEW], causation_rule: first_event, payload_schema: {type: object, properties: {run_id: {type: string}, goal_revision_id: {type: string}, change_revision_id: {type: [string, 'null']}}, required: [run_id], additionalProperties: false}}
  - {event_type: run.blocked, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [BLOCKED], causation_rule: state_transition, payload_schema: {type: object, properties: {reason: {type: string}, blocker_digest: {type: string}}, required: [reason], additionalProperties: false}}
  - {event_type: run.interrupted, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [INTERRUPTED], causation_rule: state_transition, payload_schema: {type: object, properties: {reason: {type: string}, checkpoint_id: {type: [string, 'null']}}, required: [reason], additionalProperties: false}}
  - {event_type: run.failed, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [FAILED], causation_rule: state_transition, payload_schema: {type: object, properties: {reason: {type: string}, error_digest: {type: [string, 'null']}}, required: [reason], additionalProperties: false}}
  - {event_type: state.transition.requested, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {from_state: {type: string}, to_state: {type: string}, reason: {type: string}}, required: [to_state], additionalProperties: false}}
  - {event_type: state.transition.committed, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: request_event, payload_schema: {type: object, properties: {from_state: {type: string}, to_state: {type: string}, run_version: {type: integer}}, required: [to_state, run_version], additionalProperties: false}}
  - {event_type: state.transition.rejected, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: standard, allowed_states: [], causation_rule: request_event, payload_schema: {type: object, properties: {reason_code: {type: string}, requested_state: {type: string}}, required: [reason_code], additionalProperties: false}}
  - {event_type: repository.snapshot.captured, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {snapshot_digest: {type: string}}, required: [snapshot_digest], additionalProperties: false}}
  - {event_type: worktree.created, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: tool_request, payload_schema: {type: object, properties: {worktree_id: {type: string}, path: {type: string}}, required: [worktree_id], additionalProperties: false}}
  - {event_type: worktree.disposed, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: tool_request, payload_schema: {type: object, properties: {worktree_id: {type: string}}, required: [worktree_id], additionalProperties: false}}
  - {event_type: goal.revision.created, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {goal_revision_id: {type: string}, digest: {type: string}}, required: [goal_revision_id, digest], additionalProperties: false}}
  - {event_type: change.revision.created, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {change_revision_id: {type: string}, digest: {type: string}}, required: [change_revision_id, digest], additionalProperties: false}}
  - {event_type: verification.plan.created, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {plan_id: {type: string}, digest: {type: string}}, required: [plan_id, digest], additionalProperties: false}}
  - {event_type: approval.requested, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {approval_id: {type: string}, request_digest: {type: string}}, required: [approval_id, request_digest], additionalProperties: false}}
  - {event_type: approval.granted, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: approval_request, payload_schema: {type: object, properties: {approval_id: {type: string}, grant_id: {type: string}}, required: [approval_id, grant_id], additionalProperties: false}}
  - {event_type: approval.denied, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: standard, allowed_states: [], causation_rule: approval_request, payload_schema: {type: object, properties: {approval_id: {type: string}, reason: {type: string}}, required: [approval_id, reason], additionalProperties: false}}
  - {event_type: approval.revoked, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: approval_request, payload_schema: {type: object, properties: {approval_id: {type: string}, reason: {type: string}}, required: [approval_id], additionalProperties: false}}
  - {event_type: approval.consumed, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: approval_request, payload_schema: {type: object, properties: {approval_id: {type: string}, txn_id: {type: string}}, required: [approval_id, txn_id], additionalProperties: false}}
  - {event_type: model.call.started, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: secret_safe, allowed_states: [], causation_rule: tool_request, payload_schema: {type: object, properties: {call_id: {type: string}, model: {type: string}}, required: [call_id, model], additionalProperties: false}}
  - {event_type: model.call.completed, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: secret_safe, allowed_states: [], causation_rule: model_start, payload_schema: {type: object, properties: {call_id: {type: string}, result_digest: {type: string}}, required: [call_id, result_digest], additionalProperties: false}}
  - {event_type: model.call.failed, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: secret_safe, allowed_states: [], causation_rule: model_start, payload_schema: {type: object, properties: {call_id: {type: string}, reason: {type: string}}, required: [call_id, reason], additionalProperties: false}}
  - {event_type: tool.call.requested, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: secret_safe, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {tool_call_id: {type: string}, tool: {type: string}, request_digest: {type: string}}, required: [tool_call_id, tool, request_digest], additionalProperties: false}}
  - {event_type: tool.call.authorized, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: secret_safe, allowed_states: [], causation_rule: tool_request, payload_schema: {type: object, properties: {tool_call_id: {type: string}, decision: {type: string}}, required: [tool_call_id, decision], additionalProperties: false}}
  - {event_type: tool.call.completed, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: secret_safe, allowed_states: [], causation_rule: tool_request, payload_schema: {type: object, properties: {tool_call_id: {type: string}, result_digest: {type: [string, 'null']}}, required: [tool_call_id], additionalProperties: false}}
  - {event_type: tool.call.failed, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: secret_safe, allowed_states: [], causation_rule: tool_request, payload_schema: {type: object, properties: {tool_call_id: {type: string}, reason: {type: string}}, required: [tool_call_id, reason], additionalProperties: false}}
  - {event_type: patch.applied, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: tool_request, payload_schema: {type: object, properties: {patch_digest: {type: string}, candidate_snapshot_digest: {type: string}}, required: [patch_digest, candidate_snapshot_digest], additionalProperties: false}}
  - {event_type: candidate.snapshot.captured, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: tool_request, payload_schema: {type: object, properties: {snapshot_digest: {type: string}}, required: [snapshot_digest], additionalProperties: false}}
  - {event_type: verification.check.started, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {check_id: {type: string}}, required: [check_id], additionalProperties: false}}
  - {event_type: verification.check.completed, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: check_start, payload_schema: {type: object, properties: {check_id: {type: string}, status: {type: string}, result_digest: {type: string}}, required: [check_id, status], additionalProperties: false}}
  - {event_type: verification.evidence.invalidated, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {check_id: {type: string}, reason: {type: string}}, required: [check_id, reason], additionalProperties: false}}
  - {event_type: intent_review.started, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {review_id: {type: string}}, required: [review_id], additionalProperties: false}}
  - {event_type: intent_review.completed, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: standard, allowed_states: [], causation_rule: review_start, payload_schema: {type: object, properties: {review_id: {type: string}, outcome: {type: string}}, required: [review_id, outcome], additionalProperties: false}}
  - {event_type: evidence.manifest.created, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {manifest_id: {type: string}, digest: {type: string}}, required: [manifest_id, digest], additionalProperties: false}}
  - {event_type: acceptance.requested, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {acceptance_id: {type: string}}, required: [acceptance_id], additionalProperties: false}}
  - {event_type: integration.started, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {integration_id: {type: string}, destination_before: {type: string}}, required: [integration_id, destination_before], additionalProperties: false}}
  - {event_type: integration.conflict, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [INTEGRATION_CONFLICT], causation_rule: integration_start, payload_schema: {type: object, properties: {integration_id: {type: string}, reason: {type: string}}, required: [integration_id, reason], additionalProperties: false}}
  - {event_type: integration.completed, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: integration_start, payload_schema: {type: object, properties: {integration_id: {type: string}, destination_after: {type: string}}, required: [integration_id, destination_after], additionalProperties: false}}
  - {event_type: post_integration.completed, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: integration_completed, payload_schema: {type: object, properties: {integration_id: {type: string}, evidence_manifest_id: {type: string}}, required: [integration_id, evidence_manifest_id], additionalProperties: false}}
  - {event_type: artifact.stored, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: secret_safe, allowed_states: [], causation_rule: tool_request, payload_schema: {type: object, properties: {artifact_digest: {type: string}, byte_length: {type: integer}}, required: [artifact_digest, byte_length], additionalProperties: false}}
  - {event_type: checkpoint.created, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {checkpoint_id: {type: string}, digest: {type: string}}, required: [checkpoint_id, digest], additionalProperties: false}}
  - {event_type: recovery.started, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: standard, allowed_states: [RECOVERY_REQUIRED], causation_rule: null_or_command, payload_schema: {type: object, properties: {recovery_plan_id: {type: string}}, required: [recovery_plan_id], additionalProperties: false}}
  - {event_type: recovery.completed, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: recovery_start, payload_schema: {type: object, properties: {recovery_plan_id: {type: string}, target_state: {type: string}}, required: [recovery_plan_id, target_state], additionalProperties: false}}
  - {event_type: reconciliation.required, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [RECONCILIATION_REQUIRED], causation_rule: null_or_command, payload_schema: {type: object, properties: {txn_id: {type: string}, classification: {type: string}}, required: [txn_id, classification], additionalProperties: false}}
  - {event_type: reconciliation.completed, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: standard, allowed_states: [], causation_rule: reconciliation_required, payload_schema: {type: object, properties: {txn_id: {type: string}, classification: {type: string}}, required: [txn_id, classification], additionalProperties: false}}
  - {event_type: subagent.dispatched, schema_version: 1, replay_role: AUTHORITATIVE, redaction_profile: secret_safe, allowed_states: [], causation_rule: null_or_command, payload_schema: {type: object, properties: {work_package_id: {type: string}, child_run_id: {type: string}}, required: [work_package_id, child_run_id], additionalProperties: false}}
  - {event_type: subagent.completed, schema_version: 1, replay_role: AUDIT_ONLY, redaction_profile: secret_safe, allowed_states: [], causation_rule: subagent_dispatch, payload_schema: {type: object, properties: {work_package_id: {type: string}, outcome: {type: string}}, required: [work_package_id, outcome], additionalProperties: false}}
