$schema: https://agentic-coding-harness.dev/contracts/tool_protocol/registry.schema.json
x-contract-name: ToolProtocol
x-contract-version: 1

# This is the only agent-callable tool registry.  A tool is not callable unless
# it has an entry here and a matching deterministic calculator in runtime code.
tools:
  - {tool_name: fs.stat, tool_version: 1, request_schema_ref: fs.stat.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_INVALID_ARGUMENT, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: immediate, output_limit_profile: default}
  - {tool_name: fs.list, tool_version: 1, request_schema_ref: fs.list.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_INVALID_ARGUMENT, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: immediate, output_limit_profile: artifactize}
  - {tool_name: fs.read_bytes, tool_version: 1, request_schema_ref: fs.read_bytes.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_INVALID_ARGUMENT, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: immediate, output_limit_profile: artifactize}
  - {tool_name: fs.read_text, tool_version: 1, request_schema_ref: fs.read_text.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_INVALID_ENCODING, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: immediate, output_limit_profile: artifactize}
  - {tool_name: fs.write_file, tool_version: 1, request_schema_ref: fs.write_file.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_STALE_PRECONDITION, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: SINGLE_RESOURCE_ATOMIC, cancellation_profile: before_commit, output_limit_profile: default}
  - {tool_name: fs.mkdir, tool_version: 1, request_schema_ref: fs.mkdir.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: SINGLE_RESOURCE_ATOMIC, cancellation_profile: before_commit, output_limit_profile: default}
  - {tool_name: fs.rename, tool_version: 1, request_schema_ref: fs.rename.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_STALE_PRECONDITION, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: SINGLE_RESOURCE_ATOMIC, cancellation_profile: before_commit, output_limit_profile: default}
  - {tool_name: fs.delete, tool_version: 1, request_schema_ref: fs.delete.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_STALE_PRECONDITION, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: SINGLE_RESOURCE_ATOMIC, cancellation_profile: before_commit, output_limit_profile: default}
  - {tool_name: search.literal, tool_version: 1, request_schema_ref: search.literal.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_INVALID_ENCODING, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: immediate, output_limit_profile: artifactize}
  - {tool_name: search.regex, tool_version: 1, request_schema_ref: search.regex.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_INVALID_REGEX, TOOL_INVALID_ENCODING, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: immediate, output_limit_profile: artifactize}
  - {tool_name: search.glob, tool_version: 1, request_schema_ref: search.glob.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: immediate, output_limit_profile: artifactize}
  - {tool_name: patch.apply, tool_version: 1, request_schema_ref: patch.apply.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_STALE_PRECONDITION, TOOL_PATCH_NOT_ATOMIC, TOOL_PATH_ESCAPE], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: JOURNALED_MULTI_RESOURCE, cancellation_profile: before_commit, output_limit_profile: default}
  - {tool_name: process.run, tool_version: 1, request_schema_ref: process.run.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_TIMEOUT, TOOL_CANCELLED, TOOL_PROCESS_ERROR], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: process_group, output_limit_profile: artifactize}
  - {tool_name: git.status, tool_version: 1, request_schema_ref: git.status.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: process_group, output_limit_profile: artifactize}
  - {tool_name: git.diff, tool_version: 1, request_schema_ref: git.diff.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: process_group, output_limit_profile: artifactize}
  - {tool_name: git.show, tool_version: 1, request_schema_ref: git.show.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: process_group, output_limit_profile: artifactize}
  - {tool_name: git.rev_parse, tool_version: 1, request_schema_ref: git.rev_parse.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: process_group, output_limit_profile: default}
  - {tool_name: git.ls_files, tool_version: 1, request_schema_ref: git.ls_files.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: READ_ONLY, cancellation_profile: process_group, output_limit_profile: artifactize}
  - {tool_name: git.add, tool_version: 1, request_schema_ref: git.add.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR, TOOL_STALE_PRECONDITION], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: JOURNALED_MULTI_RESOURCE, cancellation_profile: process_group, output_limit_profile: default}
  - {tool_name: git.commit, tool_version: 1, request_schema_ref: git.commit.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR, TOOL_STALE_PRECONDITION], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: JOURNALED_MULTI_RESOURCE, cancellation_profile: process_group, output_limit_profile: default}
  - {tool_name: git.worktree_create, tool_version: 1, request_schema_ref: git.worktree_create.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: JOURNALED_MULTI_RESOURCE, cancellation_profile: process_group, output_limit_profile: default}
  - {tool_name: git.worktree_remove, tool_version: 1, request_schema_ref: git.worktree_remove.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: JOURNALED_MULTI_RESOURCE, cancellation_profile: process_group, output_limit_profile: default}
  - {tool_name: git.apply_candidate_integration, tool_version: 1, request_schema_ref: git.apply_candidate_integration.request.json, result_schema_ref: common.result.json, error_codes: [TOOL_GIT_ERROR, TOOL_STALE_PRECONDITION], effect_calculator: calculate_effects, resource_calculator: calculate_resources, atomicity: JOURNALED_MULTI_RESOURCE, cancellation_profile: process_group, output_limit_profile: default}
