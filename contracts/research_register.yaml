# ResearchRegister v1 (Unified Implementation Blueprint 10.18).
# Owner: implementing agent, under the fail-closed rule in 9.18: absence of
# a completed research decision means the capability is unsupported or
# blocked. It is never permission to silently select a behavior.
$schema: https://agentic-coding-harness.dev/contracts/research_register.schema.json
x-contract-name: ResearchRegister
x-contract-version: 1

records:
  - research_id: GIT_MIN_VERSION
    capability: Minimum supported system Git version for repository/worktree identity.
    question: >-
      What is the lowest system Git version the harness can require while
      guaranteeing the safe.directory ownership check (CVE-2022-24765) and
      its Windows path-handling bypass fix (CVE-2022-29187) are present,
      given the harness creates and operates worktrees on the caller's
      behalf across trust boundaries?
    authoritative_sources_allowed:
      - https://github.blog/open-source/git/git-security-vulnerability-announced/
      - https://github.com/git/git/security/advisories
    resolved_value: "2.35.3"
    source_refs:
      - https://github.blog/open-source/git/git-security-vulnerability-announced/
      - https://seclists.org/oss-sec/2022/q2/38
    observed_versions:
      - "2.30.3"
      - "2.31.2"
      - "2.32.1"
      - "2.33.2"
      - "2.34.2"
      - "2.35.2"
      - "2.35.3"
    verified_at: "2026-09-19T00:00:00Z"
    expires_at: null
    recheck_trigger: A new Git CVE affecting worktree/config/ownership trust is disclosed, or the harness raises its security baseline.
    failure_behavior: BLOCKED_CAPABILITY

